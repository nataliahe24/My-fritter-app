<div class="product-list-container">
  <div class="product-grid" *ngIf="products$ | async as products; else loading">
    <app-product-card 
      *ngFor="let product of products"
      [product]="product"
      [name]="product.name"
      [description]="product.description"
      [price]="product.price"
      [imageUrl]="product.imageUrl"
      [showEditButton]="isAdmin"
      [showDeleteButton]="isAdmin"
      [showOrderButton]="!isAdmin"
      [showAddToCartButton]="!isAdmin"
      (editProduct)="onEditProduct(product)"
      (deleteProduct)="onDeleteProduct(product)"
      (orderProduct)="onOrderProduct($event)"
      (addToCart)="onAddToCart($event)"
    ></app-product-card>
  </div>

  <ng-template #loading>
    <p>Loading products...</p>
  </ng-template>

  <div class="pagination" *ngIf="totalPages > 0">
    <button 
      [disabled]="currentPage === 1"
      (click)="onPageChange(currentPage - 1)"
      class="pagination-btn"
    >
      <span class="material-icons">chevron_left</span>
    </button>
    
    <button 
      *ngFor="let page of [].constructor(totalPages); let i = index"
      [class.active]="currentPage === i + 1"
      (click)="onPageChange(i + 1)"
      class="pagination-btn"
    >
      {{ i + 1 }}
    </button>
    
    <button 
      [disabled]="currentPage === totalPages"
      (click)="onPageChange(currentPage + 1)"
      class="pagination-btn"
    >
      <span class="material-icons">chevron_right</span>
    </button>
  </div>

 
  <app-product-update-modal
    [product]="selectedProduct"
    [isOpen]="isModalOpen"
    [isLoading]="isLoading"
    (closeModal)="onCloseModal()"
    (updateProduct)="onUpdateProduct($event)"
  ></app-product-update-modal>

 
  <app-delete-product-modal
    [product]="productToDelete"
    [isOpen]="isDeleteModalOpen"
    [isLoading]="isLoading"
    (closeModal)="onCloseDeleteModal()"
    (confirmDelete)="onConfirmDelete()"
  ></app-delete-product-modal>

 
  <app-cart-modal
    [isVisible]="isCartModalOpen"
    (closeModal)="onCloseCartModal()"
    (orderCreated)="onCartOrderCreated()"
  ></app-cart-modal>
</div>
