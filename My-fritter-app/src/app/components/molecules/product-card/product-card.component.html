<div class="product-card">
  <div class="product-card__image-container">
    <img 
      [src]="currentImageUrl" 
      [alt]="name" 
      class="product-card__image"
      (error)="onImageError()"
    />
    <div class="product-card__actions" *ngIf="showEditButton || showDeleteButton">
      <button 
        *ngIf="showEditButton"
        class="product-card__edit-btn"
        (click)="onEditClick()"
        aria-label="Editar producto"
      >
        <span class="material-icons">edit</span>
      </button>
      <button 
        *ngIf="showDeleteButton"
        class="product-card__delete-btn"
        (click)="onDeleteClick()"
        aria-label="Eliminar producto"
      >
        <span class="material-icons">delete</span>
      </button>
    </div>
  </div>
  <div class="product-card__content">
    <h3 class="product-card__name">{{ name }}</h3>
    <p class="product-card__description">{{ description }}</p>
    <p class="product-card__price">{{ price | currency : 'USD' }}</p>

    <button 
      *ngIf="showAddToCartButton"
      class="product-card__add-to-cart-btn"
      (click)="onAddToCartClick()"
      aria-label="Agregar al carrito"
    >
      Agregar al Carrito
    </button>
  </div>
</div>
