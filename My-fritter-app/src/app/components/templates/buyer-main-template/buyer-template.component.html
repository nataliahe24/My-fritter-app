<div class="template" [class.template--sidebar-collapsed]="isSidebarCollapsed">
  <app-header class="template__header" [showCart]="true" (openCart)="onCartClick()"></app-header>
  
  <div class="content-wrapper">
    
  <app-sidebar 
    class="template__sidebar"
    [class.template__sidebar--collapsed]="isSidebarCollapsed"
    (toggleSidebar)="toggleSidebar()"
    [navItems]="navItems">
  </app-sidebar>
  
  <main class="main-content">
    <ng-content></ng-content>
  </main>
  </div>
  
  <app-footer class="template__footer"></app-footer>
</div>
